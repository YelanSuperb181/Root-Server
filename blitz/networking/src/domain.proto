// Blitz's domain: what a domain window asks the App's server. Everyone who
// opens the domain gets their own Blitz, which lives entirely in their window
// (its physics, tricks, sleep and the burst bubble). The server only does what
// a window can't: think with Claude, whose API key never leaves the server.

syntax = "proto3";

// Something typed into the domain, for Blitz to think over.
message ThinkRequest {
  string text = 1;
  // How the asker's own Blitz is doing, so the answer fits.
  bool asleep = 2;
  bool open = 3;
}

message ThinkResponse {
  // False when there's no thought (no Claude key, Claude unavailable, or too
  // soon after the last message): the window reads the mood itself.
  bool thought = 1;
  // happy, love, shy, laugh, excited, curious, comfort, grumpy, sad, scared, sleepy
  string mood = 2;
  // Blitz's line back, shown in its speech bubble.
  string say = 3;
  // The trick Blitz does in answer; empty for none.
  string trick = 4;
}

service BlitzDomainService {
  rpc Think(ThinkRequest) returns (ThinkResponse);
}
