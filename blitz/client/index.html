<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060914" />
    <title>Blitz's Domain</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="stage">
      <section class="window" aria-label="Blitz's domain">
        <div class="bar">
          <div class="sigil" aria-hidden="true"></div>
          <div class="titles">
            <h1>Blitz's Domain</h1>
            <p>Your very own Blitz</p>
          </div>
          <div class="actions">
            <span class="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status">summoning…</span></span>
            <button class="btn seal summon" type="button" id="summon" hidden aria-pressed="false" title="Blitz summons the menu">✦ Summon menu</button>
            <button class="btn seal" type="button" id="seal" hidden>Seal the bubble</button>
          </div>
        </div>
        <div class="domain" id="domain">
          <canvas id="canvas" tabindex="0" aria-label="Blitz, a glowing spirit floating in a round domain. Drag it to carry it, let go to fling it, slam it into the wall, tap it to poke it. Arrow keys nudge it; space pokes it."></canvas>
          <div class="vignette" id="vignette" aria-hidden="true"></div>
          <div class="card" id="card" hidden aria-live="polite">
            <p class="card-from"><b id="card-name"></b> <span id="card-where"></span></p>
            <p class="card-text" id="card-text"></p>
          </div>
        </div>
        <form class="say" id="say" autocomplete="off">
          <input id="say-input" type="text" maxlength="160" placeholder="Say something to Blitz…" aria-label="Say something to Blitz" enterkeyhint="send" />
          <button class="btn" type="submit">Send</button>
        </form>
        <div class="hints"><span><b>Drag</b> to carry</span><span><b>Let go</b> to fling</span><span><b>Slam</b> it into the wall</span><span><b>Tap</b> to poke</span><span><b>Hold it</b> against the wall… if you dare</span></div>
      </section>
      <p class="note" id="note" hidden></p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
