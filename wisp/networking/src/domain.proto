// Wisp's domain: what the open domain windows and the App's server say to
// each other. Positions and speeds are in domain radii (the rim is at 1).
// rpc Foo is a domain asking the server; rpc BroadcastFoo is the server
// telling every open domain.

syntax = "proto3";

import "rootsdk/types.proto";

message WispState {
  double x = 1;
  double y = 2;
  double vx = 3;
  double vy = 4;
  // The server's clock (seconds) at the moment this state describes.
  double sim_time = 5;
  bool asleep = 6;
  // Who is holding Wisp; empty when nobody is.
  string holder_user_id = 7;
  string holder_nickname = 8;
  // Where the holder's pointer is.
  double target_x = 9;
  double target_y = 10;
  // Until this server time, Wisp is still coasting from a throw.
  double fling_until = 11;
  uint32 seq = 12;
  // How close the bubble's wall is to bursting, 0 to 1.
  double strain = 13;
  // The bubble has burst: Wisp has the whole open arena.
  bool open = 14;
  // The trick Wisp is doing (empty for none), when it starts, where Wisp
  // was when it began, and which way round (1 or -1).
  string trick = 15;
  double trick_start = 16;
  double trick_x = 17;
  double trick_y = 18;
  double trick_dir = 19;
}

message Watcher {
  string user_id = 1;
  string nickname = 2;
}

message JoinRequest {}

message JoinResponse {
  WispState state = 1;
  repeated Watcher watchers = 2;
}

message GrabRequest {
  double x = 1;
  double y = 2;
}

message GrabResponse {
  bool ok = 1;
  WispState state = 2;
}

message DragRequest {
  double target_x = 1;
  double target_y = 2;
}

message ReleaseRequest {
  double x = 1;
  double y = 2;
  double vx = 3;
  double vy = 4;
}

message PokeRequest {
  double angle = 1;
}

// Something typed into the domain, for Wisp.
message SayRequest {
  string text = 1;
}

// Put the bubble back together after it burst.
message ReformRequest {}

// Someone said something to Wisp, in chat or in the domain, and how Wisp took it.
message MessageEvent {
  string from_user_id = 1;
  string from_nickname = 2;
  // What they said, trimmed (empty when it came from a private channel).
  string text = 3;
  // The chat channel it came from; empty when typed in the domain.
  string channel_name = 4;
  // happy, love, shy, laugh, excited, curious, comfort, grumpy, sad, scared, sleepy
  string mood = 5;
  // Wisp's little line back.
  string say = 6;
  // Server time when Wisp starts reacting (the message flies over first).
  double react_at = 7;
}

message StateEvent {
  WispState state = 1;
  // grab, drag, release, poke, impact, keyframe, sleep, wake, summon,
  // trick, burst, reform
  string cause = 2;
  string by_user_id = 3;
  string by_nickname = 4;
}

message WatchersEvent {
  repeated Watcher watchers = 1;
}

service WispDomainService {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Grab(GrabRequest) returns (GrabResponse);
  rpc Drag(DragRequest) returns (rootsdk.Void);
  rpc Release(ReleaseRequest) returns (rootsdk.Void);
  rpc Poke(PokeRequest) returns (rootsdk.Void);
  rpc Say(SayRequest) returns (rootsdk.Void);
  rpc Reform(ReformRequest) returns (rootsdk.Void);

  rpc BroadcastState(StateEvent) returns (rootsdk.Void);
  rpc BroadcastWatchers(WatchersEvent) returns (rootsdk.Void);
  rpc BroadcastMessage(MessageEvent) returns (rootsdk.Void);
}
