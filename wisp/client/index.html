<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060914" />
    <title>Wisp's Domain</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="stage">
      <section class="window" aria-label="Wisp's domain">
        <div class="bar">
          <div class="sigil" aria-hidden="true"></div>
          <div class="titles">
            <h1>Wisp's Domain</h1>
            <p id="watchers">Opening…</p>
          </div>
          <div class="actions">
            <span class="status" role="status" aria-live="polite"><span class="dot" aria-hidden="true"></span><span id="status">summoning…</span></span>
            <button class="btn" type="button" id="expand" hidden>Expand</button>
          </div>
        </div>
        <div class="domain" id="domain">
          <canvas id="canvas" tabindex="0" aria-label="Wisp, a glowing spirit floating in a round domain. Drag it to carry it, let go to fling it, slam it into the wall, tap it to poke it. Arrow keys nudge it; space pokes it."></canvas>
        </div>
        <div class="hints"><span><b>Drag</b> to carry</span><span><b>Let go</b> to fling</span><span><b>Slam</b> it into the wall</span><span><b>Tap</b> to poke</span></div>
      </section>
      <p class="note" id="note" hidden></p>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
